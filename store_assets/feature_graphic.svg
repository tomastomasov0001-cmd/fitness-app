<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 500">
  <!-- Pozadí - gradient fialový -->
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#7C4DFF"/>
      <stop offset="100%" style="stop-color:#6200EE"/>
    </linearGradient>
    <!-- Dekorativní kruhy -->
    <radialGradient id="circle1" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#9C7CFF;stop-opacity:0.3"/>
      <stop offset="100%" style="stop-color:#7C4DFF;stop-opacity:0"/>
    </radialGradient>
  </defs>

  <!-- Hlavní pozadí -->
  <rect width="1024" height="500" fill="url(#bgGrad)"/>

  <!-- Dekorativní kruhy v pozadí -->
  <circle cx="150" cy="400" r="200" fill="url(#circle1)"/>
  <circle cx="900" cy="100" r="250" fill="url(#circle1)"/>
  <circle cx="700" cy="450" r="150" fill="url(#circle1)"/>

  <!-- Činka vlevo - velká dekorace -->
  <g opacity="0.15" transform="translate(50, 180)">
    <rect x="0" y="40" width="200" height="30" rx="15" fill="#FFFFFF"/>
    <rect x="-20" y="0" width="50" height="110" rx="10" fill="#FFFFFF"/>
    <rect x="170" y="0" width="50" height="110" rx="10" fill="#FFFFFF"/>
  </g>

  <!-- Ikona aplikace - malá činka -->
  <g transform="translate(100, 170)">
    <!-- Pozadí ikony -->
    <rect x="0" y="0" width="160" height="160" rx="32" fill="#FFFFFF" opacity="0.95"/>
    <!-- Činka -->
    <g transform="translate(80, 80)">
      <line x1="-50" y1="0" x2="50" y2="0" stroke="#6200EE" stroke-width="12" stroke-linecap="round"/>
      <rect x="-60" y="-25" width="18" height="50" rx="4" fill="#6200EE"/>
      <rect x="-48" y="-18" width="12" height="36" rx="3" fill="#6200EE"/>
      <rect x="42" y="-25" width="18" height="50" rx="4" fill="#6200EE"/>
      <rect x="36" y="-18" width="12" height="36" rx="3" fill="#6200EE"/>
    </g>
  </g>

  <!-- Název aplikace -->
  <text x="300" y="220" font-family="Arial, sans-serif" font-size="72" font-weight="bold" fill="#FFFFFF">
    Fitness App
  </text>

  <!-- Slogan -->
  <text x="300" y="280" font-family="Arial, sans-serif" font-size="32" fill="#FFFFFF" opacity="0.9">
    Sledujte své tréninky
  </text>

  <!-- Funkce - ikony s textem -->
  <g transform="translate(300, 320)" fill="#FFFFFF">
    <!-- Kalendář -->
    <g transform="translate(0, 0)">
      <rect x="0" y="0" width="36" height="36" rx="6" fill="none" stroke="#FFFFFF" stroke-width="2.5"/>
      <line x1="0" y1="12" x2="36" y2="12" stroke="#FFFFFF" stroke-width="2.5"/>
      <circle cx="12" cy="24" r="3" fill="#FFFFFF"/>
      <circle cx="24" cy="24" r="3" fill="#FFFFFF"/>
      <text x="50" y="26" font-size="20" opacity="0.9">Kalendář</text>
    </g>

    <!-- Statistiky -->
    <g transform="translate(180, 0)">
      <rect x="4" y="20" width="8" height="16" rx="2" fill="#FFFFFF"/>
      <rect x="16" y="10" width="8" height="26" rx="2" fill="#FFFFFF"/>
      <rect x="28" y="0" width="8" height="36" rx="2" fill="#FFFFFF"/>
      <text x="50" y="26" font-size="20" opacity="0.9">Statistiky</text>
    </g>

    <!-- Export -->
    <g transform="translate(360, 0)">
      <rect x="4" y="8" width="28" height="28" rx="4" fill="none" stroke="#FFFFFF" stroke-width="2.5"/>
      <path d="M18 4 L18 22 M10 14 L18 6 L26 14" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
      <text x="50" y="26" font-size="20" opacity="0.9">Export</text>
    </g>
  </g>

  <!-- Dekorativní činka vpravo dole -->
  <g opacity="0.12" transform="translate(750, 350) rotate(-15)">
    <rect x="0" y="20" width="250" height="35" rx="17" fill="#FFFFFF"/>
    <rect x="-25" y="0" width="60" height="75" rx="12" fill="#FFFFFF"/>
    <rect x="215" y="0" width="60" height="75" rx="12" fill="#FFFFFF"/>
  </g>

</svg>
